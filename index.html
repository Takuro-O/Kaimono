<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="買い物リスト">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>買い物リスト</title>
<style>
:root{
  --c-bg:#ffffff;--c-surface:#f6f7f9;--c-border:#eeeeee;--c-text:#1a1a1a;--c-sub:#888888;
  --c-primary:#16a34a;--c-primary-light:#ecfdf3;--c-danger:#ef4444;--c-success:#22c55e;
  --radius-s:8px;--radius-m:12px;--radius-l:20px;
  --shadow-card:0 1px 4px rgba(0,0,0,.07);--shadow-modal:0 -4px 24px rgba(0,0,0,.10);--transition:.18s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;background:var(--c-bg);color:var(--c-text);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;overscroll-behavior:none}
#app{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;color:inherit}
input,textarea{font-family:inherit;font-size:16px;color:var(--c-text)}
.tappable{transition:transform var(--transition),opacity var(--transition);-webkit-tap-highlight-color:transparent}
.tappable:active{transform:scale(.97);opacity:.85}

header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--c-border);padding:env(safe-area-inset-top) 16px 0;}
.hrow{height:56px;display:flex;align-items:center;justify-content:space-between}
.hrow h1{font-size:18px;font-weight:700}
.hbtns{display:flex;gap:4px}
.ibtn{height:40px;min-width:40px;padding:0 10px;border:none;background:transparent;border-radius:var(--radius-s);font-size:20px}
.ibtn.txt{font-size:13px;font-weight:600;color:var(--c-primary)}

.addbar{display:flex;gap:8px;padding:4px 0 10px}
.addbar input{flex:1;height:44px;padding:0 14px;background:var(--c-surface);border:1.5px solid transparent;border-radius:var(--radius-m);outline:none;transition:border-color var(--transition)}
.addbar input:focus{border-color:var(--c-primary);background:#fff}
.addbar button{width:64px;height:44px;border:none;border-radius:var(--radius-m);background:var(--c-primary);color:#fff;font-size:15px;font-weight:700}

.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border:1px solid var(--c-border);background:#fff;border-radius:16px;font-size:14px;white-space:nowrap}
.chip.sel{background:var(--c-primary);border-color:var(--c-primary);color:#fff;font-weight:700}
.chips .lbl{flex:none;align-self:center;font-size:12px;color:var(--c-sub);margin-right:-2px}
.chip b{color:var(--c-primary);margin-right:2px}

.seg{display:flex;background:var(--c-surface);border-radius:var(--radius-s);padding:3px;margin:0 16px 12px}
.seg button{flex:1;height:34px;border:none;border-radius:6px;font-size:14px;font-weight:600;background:transparent;color:var(--c-sub);transition:all var(--transition)}
.seg button.active{background:#fff;color:var(--c-text);box-shadow:var(--shadow-card)}

main{flex:1;padding:12px 0 calc(24px + env(safe-area-inset-bottom))}
.progress{margin:0 16px 14px}
.progress .bar{height:6px;background:var(--c-surface);border-radius:3px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--c-primary);border-radius:3px;transition:width .3s ease}
.progress .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--c-sub);margin-top:6px}

.sec-h{font-size:13px;font-weight:600;color:var(--c-sub);padding:0 16px;margin:18px 0 6px;display:flex;justify-content:space-between;align-items:center}
.sec-h button{border:none;background:none;font-size:13px;font-weight:600;color:var(--c-primary)}
.card{margin:0 16px;border:1px solid var(--c-border);border-radius:var(--radius-m);overflow:hidden;box-shadow:var(--shadow-card);background:#fff}
.rw{position:relative;overflow:hidden;border-top:1px solid var(--c-border)}
.rw:first-child{border-top:none}
.rw .del{position:absolute;inset:0;background:var(--c-danger);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:22px;font-size:20px}
.row{position:relative;background:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:56px;transition:transform .2s ease}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #cfd4da;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;transition:all var(--transition)}
.done .chk{background:var(--c-primary);border-color:var(--c-primary)}
.body{flex:1;min-width:0;text-align:left;background:none;border:none}
.nm{font-size:16px;font-weight:500;display:flex;gap:6px;align-items:baseline}
.nm .q{font-size:13px;font-weight:700;color:var(--c-primary);flex:none}
.sub{font-size:12px;color:var(--c-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done .nm,.done .sub{color:#b4b9c0;text-decoration:line-through}

.empty{text-align:center;padding:56px 24px;color:var(--c-sub)}
.empty .em{font-size:48px;margin-bottom:12px}
.empty p:first-of-type{font-size:16px;font-weight:600;color:var(--c-text);margin-bottom:6px}
.empty p{font-size:14px}

.hrowx{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--c-border);min-height:56px}
.hrowx:first-child{border-top:none}
.hrowx .nm{flex:1;min-width:0}
.hrowx .star{border:none;background:none;font-size:20px;width:36px;height:36px;filter:grayscale(1);opacity:.4}
.hrowx .star.on{filter:none;opacity:1}
.hrowx .add{flex:none;height:34px;padding:0 14px;border:none;border-radius:17px;background:var(--c-primary-light);color:var(--c-primary);font-weight:700;font-size:14px}
.hrowx .add.in{background:var(--c-surface);color:var(--c-sub)}

.ov{display:none;position:fixed;inset:0;z-index:200;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.ov .bd{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet{position:relative;width:100%;max-width:430px;background:#fff;border-radius:var(--radius-l) var(--radius-l) 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90dvh;overflow-y:auto;box-shadow:var(--shadow-modal);animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.grab{width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 18px}
.sheet h2{font-size:17px;font-weight:700;margin-bottom:4px}
.sheet .desc{font-size:14px;color:var(--c-sub);margin-bottom:16px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;font-weight:600;color:var(--c-sub);margin-bottom:6px}
.fld input,.fld textarea{width:100%;height:44px;padding:0 12px;border:1.5px solid var(--c-border);border-radius:var(--radius-s);outline:none;transition:border-color var(--transition);background:#fff}
.fld input:focus{border-color:var(--c-primary)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats button{height:36px;padding:0 12px;border:1.5px solid var(--c-border);background:#fff;border-radius:18px;font-size:14px}
.cats button.on{border-color:var(--c-primary);background:var(--c-primary-light);color:var(--c-primary);font-weight:700}
.stp{display:flex;align-items:center;border:1.5px solid var(--c-border);border-radius:var(--radius-s);overflow:hidden;width:fit-content}
.stp button{width:44px;height:42px;background:var(--c-surface);border:none;font-size:20px}
.stp span{min-width:44px;text-align:center;font-weight:700}
.btn{width:100%;height:48px;border:none;border-radius:var(--radius-s);font-size:16px;font-weight:600;margin-top:8px}
.btn.p{background:var(--c-primary);color:#fff}
.btn.s{background:transparent;color:var(--c-primary);border:1.5px solid var(--c-primary)}
.btn.d{background:var(--c-danger);color:#fff}
.btn.g{background:transparent;color:var(--c-sub);height:44px}
.mrow{width:100%;height:54px;display:flex;align-items:center;gap:12px;background:none;border:none;border-top:1px solid var(--c-border);font-size:16px;text-align:left}
.mrow:first-of-type{border-top:none}
.mrow span:first-child{font-size:20px;width:28px;text-align:center}

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#cbd5e1;vertical-align:middle}
.dot.on{background:#22c55e}
.dot.connecting{background:#f59e0b;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
#btnAwake{opacity:.3;transition:opacity var(--transition)}
#btnAwake.on{opacity:1;background:#fef9c3}
.pasterow{display:flex;gap:8px;margin-top:10px}
.pasterow input{flex:1;min-width:0;height:44px;padding:0 12px;border:1.5px solid var(--c-border);border-radius:var(--radius-s);outline:none}
.pasterow input:focus{border-color:var(--c-primary)}
.pasterow button{flex:none;width:72px;height:44px;border:none;border-radius:var(--radius-s);background:var(--c-primary);color:#fff;font-weight:700}
.note{font-size:12px;color:var(--c-sub);margin-top:12px;line-height:1.7}
.stat{display:flex;align-items:center;font-size:14px;font-weight:600;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:#1f2937;color:#fff;padding:10px 16px;border-radius:22px;font-size:14px;font-weight:600;z-index:999;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.2)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast button{background:none;border:none;color:#86efac;font-weight:700;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <h1>🛒 買い物リスト</h1>
      <div class="hbtns">
        <button class="ibtn tappable" id="btnAwake" aria-label="画面をつけたままにする" style="display:none">☀️</button>
        <button class="ibtn tappable" id="btnShare" aria-label="共有と同期"><span id="syncDot" class="dot"></span>📤</button>
        <button class="ibtn tappable" id="btnMenu" aria-label="メニュー">⋯</button>
      </div>
    </div>
    <div id="addArea">
      <form class="addbar" id="addForm" autocomplete="off">
        <input id="addInput" type="text" placeholder="買うものを入力（例：牛乳 2）" enterkeyhint="done" aria-label="商品名">
        <button type="submit" class="tappable">追加</button>
      </form>
      <div class="chips" id="shopSel"></div>
      <div class="chips" id="sugg"></div>
    </div>
  </header>

  <div class="seg" style="margin-top:12px">
    <button class="tappable active" data-tab="list">🛒 リスト</button>
    <button class="tappable" data-tab="fav">⭐ よく買うもの</button>
  </div>

  <main id="main"></main>
</div>

<div class="ov" id="ovEdit"><div class="bd" data-close></div><div class="sheet" id="sheetEdit"></div></div>
<div class="ov" id="ovShare"><div class="bd" data-close></div><div class="sheet" id="sheetShare"></div></div>
<div class="ov" id="ovMenu"><div class="bd" data-close></div><div class="sheet" id="sheetMenu"></div></div>
<div class="ov" id="ovConfirm"><div class="bd" data-close></div><div class="sheet" id="sheetConfirm"></div></div>
<div id="toast"></div>

<script>
/* ===== データ ===== */
const KEY='kaimono2_v1';
/* 「買う場所」で分類する。cat には場所の名前をそのまま入れるので、端末ごとに増やしても同期で自然に伝わる */
const SHOPS=[{n:'スーパー',e:'🏪'},{n:'Amazon',e:'📦'},{n:'セリア',e:'🧺'},{n:'ダイソー',e:'🛍️'},{n:'その他',e:'🛒'}];
const SHOP_E=Object.fromEntries(SHOPS.map(x=>[x.n,x.e]));
const shopE=n=>SHOP_E[n]||'🏬';
const LEGACY=new Set(['veg','meat','dairy','staple','drink','season','frozen','daily','other']);
/* 旧「売り場」の値は「スーパー」に寄せる。旧版から引き継いだ店名（Amazon等）はメモに入っているので拾って移す */
function fixShop(cat,memo){
  memo=String(memo||'');
  if(LEGACY.has(cat)){
    const segs=memo.split(' ・ ').filter(Boolean);let n='スーパー';
    const k=segs.findIndex(x=>x==='Amazon'||x==='その他');
    if(k>=0){n=segs[k];segs.splice(k,1)}
    return {cat:n,memo:segs.join(' ・ ')};
  }
  return {cat:String(cat||'').replace(/\s+/g,' ').trim().slice(0,12)||'スーパー',memo};
}
const defState=()=>({items:[],hist:[]});
let S=(()=>{try{const d=JSON.parse(localStorage.getItem(KEY));return d&&Array.isArray(d.items)?{items:d.items,hist:d.hist||[]}:defState()}catch{return defState()}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
/* 各商品は更新時刻 t を持ち、削除は del:true（墓標）で表す。同期はこの t が新しい方を採用する */
S.items.forEach(i=>{i.t=+i.t||0;i.del=!!i.del});
S.items=S.items.filter(i=>!(i.del&&i.t<Date.now()-30*864e5));
S.items.forEach(i=>{if(i.who){i.memo=[i.who,i.memo].filter(Boolean).join(' ・ ').slice(0,100);delete i.who;i.t=Math.max(Date.now(),i.t+1)}else delete i.who;delete i.price});
const vis=()=>S.items.filter(i=>!i.del);
S.items.forEach(i=>{const f=fixShop(i.cat,i.memo);if(f.cat!==i.cat||f.memo!==(i.memo||'')){i.cat=f.cat;i.memo=f.memo;i.t=Math.max(Date.now(),i.t+1)}});
S.hist.forEach(h=>{h.cat=fixShop(h.cat,'').cat});
const SHK='kaimono2_shops',SELK='kaimono2_shop';
let customShops=(()=>{try{const a=JSON.parse(localStorage.getItem(SHK));return Array.isArray(a)?a.map(x=>String(x).slice(0,12)):[]}catch{return[]}})();
const saveShops=()=>{try{localStorage.setItem(SHK,JSON.stringify(customShops))}catch{}};
let selShop=(()=>{try{return localStorage.getItem(SELK)}catch{return null}})()||'スーパー';
function shopList(){
  const out=SHOPS.map(x=>x.n);
  [...customShops,...vis().map(i=>i.cat)].forEach(n=>{if(n&&!out.includes(n))out.push(n)});
  return out;
}
function addCustomShop(n){
  n=norm(String(n||'')).slice(0,12); if(!n) return '';
  if(!shopList().includes(n)){customShops.push(n);saveShops()}
  return n;
}
const touch=i=>{i.t=Math.max(Date.now(),(i.t||0)+1);markDirty(i.id);return i};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const haptic=(t='light')=>navigator.vibrate?.(t==='heavy'?30:10);
const norm=s=>s.trim().replace(/\s+/g,' ');

let tab='list';

function parseInput(raw){
  let s=norm(raw), qty=1;
  const m=s.match(/^(.*?)[\s　]*[x×＊*]?\s*(\d{1,2})\s*(個|本|袋|パック|つ|枚|丁|缶)?$/);
  if(m&&m[1]){s=m[1];qty=Math.min(99,+m[2]||1)}
  return {name:s,qty};
}
function bumpHist(name,cat){
  let h=S.hist.find(x=>x.name===name);
  if(h){h.n++;h.cat=cat}else S.hist.push({id:uid(),name,cat,n:1,pin:false});
}
function addItem(name,qty=1,cat,extra={}){
  name=norm(name); if(!name) return false;
  cat=cat||selShop;
  const ex=vis().find(i=>!i.done&&i.name===name&&i.cat===cat);
  if(ex){ex.qty=Math.min(99,ex.qty+qty);touch(ex);save();render();toast(`${name} の数量を ${ex.qty} にしました`);return true}
  S.items.push(touch({id:uid(),name,cat,qty,memo:'',done:false,del:false,t:0,...extra}));
  bumpHist(name,cat);save();render();return true;
}

/* ===== 描画 ===== */
function render(){
  renderShopSel();
  renderSugg();
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  $('#addArea').style.display=tab==='list'?'block':'none';
  $('#main').innerHTML=tab==='list'?listView():favView();
  bindRows();
}
function renderShopSel(){
  if(!shopList().includes(selShop)) selShop='スーパー';
  $('#shopSel').innerHTML='<span class="lbl">追加先</span>'+shopList().map(n=>`<button type="button" class="chip tappable ${n===selShop?'sel':''}" data-shop="${esc(n)}">${shopE(n)} ${esc(n)}</button>`).join('')+'<button type="button" class="chip tappable" data-shopmgr aria-label="場所を追加・整理">＋</button>';
}
function openShopMgr(){
  const sh=$('#sheetConfirm');
  const draw=()=>{sh.innerHTML=`<div class="grab"></div><h2>買う場所を追加</h2><p class="desc">コストコ、薬局など自由に追加できます。</p>
    <div class="pasterow" style="margin-top:0"><input id="newShop" maxlength="12" placeholder="例：コストコ" aria-label="場所の名前"><button class="tappable" data-ok>追加</button></div>
    ${customShops.length?`<p class="note">追加した場所（✕で選択肢から外します。その場所の商品は残ります）</p><div class="cats">${customShops.map(n=>`<button class="tappable" data-rm="${esc(n)}">${esc(n)} ✕</button>`).join('')}</div>`:''}
    <button class="btn g tappable" data-x>閉じる</button>`};
  draw();
  sh.onclick=e=>{
    if(e.target.closest('[data-x]')) return closeAll();
    if(e.target.closest('[data-ok]')){
      const n=addCustomShop($('#newShop').value); if(!n){$('#newShop').focus();return}
      selShop=n;try{localStorage.setItem(SELK,n)}catch{}
      renderShopSel();closeAll();haptic();toast(`「${n}」を追加しました`);return;
    }
    const rm=e.target.closest('[data-rm]');
    if(rm){customShops=customShops.filter(x=>x!==rm.dataset.rm);saveShops();draw();renderShopSel();}
  };
  open('#ovConfirm');
}
function renderSugg(){
  const q=norm($('#addInput').value||'');
  const inList=new Set(vis().filter(i=>!i.done).map(i=>i.name));
  let src=S.hist.filter(h=>!inList.has(h.name));
  if(q){const {name}=parseInput(q);src=src.filter(h=>h.name.includes(name)&&h.name!==name)}
  src.sort((a,b)=>(b.pin-a.pin)||(b.n-a.n));
  src=src.slice(0,12);
  $('#sugg').innerHTML=src.map(h=>`<button type="button" class="chip tappable" data-hid="${h.id}"><b>＋</b>${esc(h.name)}</button>`).join('');
  $('#sugg').style.display=src.length?'flex':'none';
}
function rowHtml(i){
  const sub=i.memo||'';
  return `<div class="rw" data-id="${i.id}"><div class="del">🗑</div>
    <div class="row ${i.done?'done':''}">
      <button class="chk tappable" data-chk="${i.id}" aria-label="購入済みにする">${i.done?'✓':''}</button>
      <button class="body tappable" data-edit="${i.id}"><div class="nm">${esc(i.name)}${i.qty>1?`<span class="q">×${i.qty}</span>`:''}</div>${sub?`<div class="sub">${esc(sub)}</div>`:''}</button>
    </div></div>`;
}
function listView(){
  const all=vis(), todo=all.filter(i=>!i.done), done=all.filter(i=>i.done);
  if(!all.length) return `<div class="empty"><div class="em">🛒</div><p>リストは空です</p><p>上の入力欄に商品名を入れて追加しましょう<br>数量は「牛乳 2」のように書けます</p></div>`;
  const pct=Math.round(done.length/all.length*100);
  let h=`<div class="progress"><div class="bar"><i style="width:${pct}%"></i></div><div class="meta"><span>${done.length} / ${all.length} 購入済み</span><span></span></div></div>`;
  if(!todo.length) h+=`<div class="empty" style="padding:28px 24px"><div class="em">🎉</div><p>全部買えました！</p></div>`;
  shopList().forEach(n=>{
    const its=todo.filter(i=>i.cat===n); if(!its.length) return;
    h+=`<div class="sec-h"><span>${shopE(n)} ${esc(n)}</span><span>${its.length}</span></div><div class="card">${its.map(rowHtml).join('')}</div>`;
  });
  if(done.length) h+=`<div class="sec-h"><span>✓ 購入済み</span><button data-act="clearDone">まとめて消す</button></div><div class="card">${done.map(rowHtml).join('')}</div>`;
  return h;
}
function favView(){
  const inList=new Set(vis().filter(i=>!i.done).map(i=>i.name));

/* ===== スワイプ削除 ===== */
function bindRows(){
  document.querySelectorAll('.rw').forEach(rw=>{
    const row=rw.querySelector('.row'); let sx=0,sy=0,dx=0,lock=null;
    rw.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;lock=null;row.style.transition='none'},{passive:true});
    rw.addEventListener('touchmove',e=>{
      const x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;
      if(lock===null&&(Math.abs(x)>8||Math.abs(y)>8)) lock=Math.abs(x)>Math.abs(y)?'x':'y';
      if(lock==='x'){dx=Math.min(0,x);row.style.transform=`translateX(${Math.max(dx,-110)}px)`}
    },{passive:true});
    rw.addEventListener('touchend',()=>{
      row.style.transition='';
      if(lock==='x'&&dx<-70){row.style.transform='translateX(-110%)';haptic('heavy');setTimeout(()=>removeItem(rw.dataset.id),160)}
      else row.style.transform='';
    });
  });
}
function removeItem(id){
  const it=S.items.find(i=>i.id===id&&!i.del); if(!it) return;
  it.del=true;touch(it);save();render();
  toast(`${it.name} を削除しました`,{label:'元に戻す',fn:()=>{it.del=false;touch(it);save();render()}});
}

/* ===== リアルタイム同期（登録不要）=====
   中継: ntfy.sh（公開の pub/sub）。内容は部屋コードから作った鍵で AES-GCM 暗号化してから送るので、
   中継サーバーには読めない暗号文だけが流れる。部屋コードを知っている人だけが読み書きできる。
   商品ごとに更新時刻 t を持ち、新しい方を採用する（削除は del:true の墓標）。 */
const SK='kaimono2_sync';
let SY=(()=>{try{return JSON.parse(localStorage.getItem(SK))||{}}catch{return{}}})();
SY.relay=SY.relay||'https://ntfy.sh';
const saveSY=()=>{try{localStorage.setItem(SK,JSON.stringify(SY))}catch{}};
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{let s='';for(let k=0;k<u.length;k+=8192)s+=String.fromCharCode.apply(null,u.subarray(k,k+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=u=>[...u].map(x=>x.toString(16).padStart(2,'0')).join('');
const sha=async s=>new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(s)));

let es=null,aesKey=null,topic='',seen={},dirty=new Set(),pushT=null,replayT=null,retryT=null,retry=0,status='off',pushing=false;

function setStatus(s){status=s;const d=$('#syncDot');if(d)d.className='dot '+(s==='on'?'on':s==='connecting'?'connecting':'')}
const hasSync=()=>!!(SY.room&&aesKey);
const newRoom=()=>hex(crypto.getRandomValues(new Uint8Array(16)));
const inviteUrl=()=>location.href.split('#')[0]+'#r='+SY.room;

async function sealMsg(obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},aesKey,enc.encode(JSON.stringify(obj))));
  const all=new Uint8Array(12+ct.length);all.set(iv);all.set(ct,12);return b64(all);
}
async function openMsg(s){
  const all=unb64(s);
  return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(0,12)},aesKey,all.slice(12))));
}
const wire=i=>({id:i.id,name:i.name,cat:i.cat,qty:i.qty,memo:i.memo,done:!!i.done,del:!!i.del,t:i.t});
function clean(r){
  const f=fixShop(r.cat,[String(r.who||'').slice(0,20),String(r.memo||'')].filter(Boolean).join(' ・ '));
  return {id:String(r.id||'').slice(0,24),name:String(r.name||'').slice(0,60),cat:f.cat,
    qty:Math.min(99,Math.max(1,+r.qty||1)),memo:f.memo.slice(0,100),
    done:!!r.done,del:!!r.del,t:+r.t||0};
}
const newer=(a,b)=>a.t>b.t||(a.t===b.t&&JSON.stringify(a)>JSON.stringify(b));

function mergeRemote(list){
  let changed=false;
  for(const raw of list){
    if(!raw||!raw.id) continue;
    const r=clean(raw); if(!r.id||!r.name) continue;
    seen[r.id]=Math.max(seen[r.id]||0,r.t);
    const l=S.items.find(i=>i.id===r.id);
    if(!l){S.items.push(r);changed=true;if(!r.del&&!S.hist.some(h=>h.name===r.name))S.hist.push({id:uid(),name:r.name,cat:r.cat,n:1,pin:false})}
    else if(newer(r,clean(l))){Object.assign(l,r);changed=true}
  }
  if(changed){save();requestAnimationFrame(render)}
}

function markDirty(id){
  dirty.add(id);
  if(!SY.room) return;
  clearTimeout(pushT);pushT=setTimeout(flush,300);
}
function pushDiff(){
  S.items.forEach(i=>{if(i.t>(seen[i.id]||0))dirty.add(i.id)});
  flush();
}
async function flush(){
  if(pushing||!hasSync()||status!=='on'||!dirty.size) return;
  pushing=true;let failed=false;
  try{
    const ids=[...dirty];dirty.clear();
    const items=ids.map(id=>S.items.find(i=>i.id===id)).filter(Boolean).map(wire);
    const chunks=[];let cur=[];
    for(const it of items){
      if(cur.length&&enc.encode(JSON.stringify([...cur,it])).length>1800){chunks.push(cur);cur=[]}
      cur.push(it);
    }
    if(cur.length) chunks.push(cur);
    for(let k=0;k<chunks.length;k++){
      let ok=false;
      try{
        const body=await sealMsg({items:chunks[k]});
        const res=await fetch(`${SY.relay}/${topic}`,{method:'POST',body});
        ok=res.ok;
      }catch{}
      if(!ok){
        for(let j=k;j<chunks.length;j++) chunks[j].forEach(x=>dirty.add(x.id));
        throw new Error('push');
      }
    }
    retry=0;
  }catch{
    failed=true;retry++;clearTimeout(pushT);pushT=setTimeout(flush,Math.min(30000,3000*2**Math.min(retry,4)));
  }finally{pushing=false}
  if(!failed&&dirty.size){clearTimeout(pushT);pushT=setTimeout(flush,300)}
}

function connect(){
  clearTimeout(retryT);
  if(es){es.onopen=es.onmessage=es.onerror=null;es.close()}
  if(!hasSync()){setStatus('off');return}
  setStatus('connecting');seen={};
  es=new EventSource(`${SY.relay}/${topic}/sse?since=all`);
  es.onopen=()=>{
    retry=0;setStatus('on');
    clearTimeout(replayT);replayT=setTimeout(pushDiff,1800); // 履歴の再生が終わってから、相手が持っていない分だけ送る
  };
  es.onmessage=async e=>{
    try{
      const m=JSON.parse(e.data);
      if(m.event&&m.event!=='message') return;
      const p=await openMsg(m.message);
      if(Array.isArray(p.items)) mergeRemote(p.items);
    }catch{}
  };
  es.onerror=()=>{
    setStatus('connecting');
    if(es.readyState===2){retryT=setTimeout(connect,Math.min(30000,2000*2**Math.min(retry++,4)))}
  };
}
async function syncStart(){
  if(!SY.room){setStatus('off');return}
  if(!window.crypto?.subtle){setStatus('off');toast('この環境では同期を使えません（https のページで開いてください）');return}
  topic='kaimono-'+hex(await sha('topic:'+SY.room)).slice(0,40);
  aesKey=await crypto.subtle.importKey('raw',await sha('key:'+SY.room),'AES-GCM',false,['encrypt','decrypt']);
  connect();
}
function syncStop(){
  clearTimeout(pushT);clearTimeout(replayT);clearTimeout(retryT);
  if(es){es.onopen=es.onmessage=es.onerror=null;es.close();es=null}
  SY.room='';aesKey=null;topic='';saveSY();setStatus('off');
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&hasSync()&&(!es||es.readyState!==1)) connect();
});
window.addEventListener('online',()=>{if(hasSync()) connect()});

function listText(){
  const todo=vis().filter(i=>!i.done);
  let t='🛒 買い物リスト\n';
  shopList().forEach(n=>{const its=todo.filter(i=>i.cat===n);if(!its.length)return;t+=`\n${shopE(n)}${n}\n`+its.map(i=>`・${i.name}${i.qty>1?' ×'+i.qty:''}${i.memo?'（'+i.memo+'）':''}`).join('\n')+'\n'});
  return t;
}
async function copy(t){
  try{await navigator.clipboard.writeText(t)}catch{
    const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
  }
}
function openShare(){
  const on=!!SY.room;
  const st={on:'リアルタイム同期中',connecting:'接続しています…',off:'同期はオフです'}[on?status:'off'];
  $('#sheetShare').innerHTML=`<div class="grab"></div>
    <h2>${on?'家族と共有中':'家族とリアルタイム共有'}</h2>
    ${on?`<div class="stat"><span class="dot ${status==='on'?'on':status==='connecting'?'connecting':''}"></span>${st}</div>
      <p class="desc">招待リンクを開いた人と、リストが自動で同期されます。</p>
      <button class="btn p tappable" data-s="invite">📤 招待リンクを送る</button>
      <button class="btn s tappable" data-s="copylink">🔗 招待リンクをコピー</button>
      <button class="btn s tappable" data-s="text">📋 リストをテキストでコピー</button>
      <button class="btn g tappable" data-s="leave" style="color:var(--c-danger)">同期をやめる</button>`
    :`<p class="desc">アカウント登録は不要です。はじめると招待リンクができ、それを開いた人とリストが自動で同期されます。</p>
      <button class="btn p tappable" data-s="start">🔗 共有をはじめる</button>
      <button class="btn s tappable" data-s="text">📋 リストをテキストでコピー</button>
      <p class="note" style="margin-top:16px">招待リンクをもらっている場合は、ここに貼り付けて参加できます（ホーム画面のアプリはこちら）。</p>
      <div class="pasterow"><input id="joinInput" placeholder="招待リンクを貼り付け" aria-label="招待リンク"><button class="tappable" data-s="join">参加</button></div>`}
    <button class="btn g tappable" data-close2>閉じる</button>
    <p class="note">内容は端末で暗号化してから送られ、中継サーバーには読めません。招待リンクを知っている人は誰でも参加できるので、家族以外には送らないでください。</p>`;
  const sh=$('#sheetShare');
  sh.onclick=async e=>{
    if(e.target.closest('[data-close2]')) return closeAll();
    const b=e.target.closest('[data-s]'); if(!b) return;
    const a=b.dataset.s;
    if(a==='text'){
      if(!vis().some(i=>!i.done)){toast('未購入の商品がありません');return}
      copy(listText()).then(()=>{toast('コピーしました');closeAll()});
    }else if(a==='start'){
      if(!window.crypto?.subtle){toast('https のページで開いてください');return}
      SY.room=newRoom();saveSY();
      await syncStart();haptic();openShare();
    }else if(a==='join'){
      const m=($('#joinInput').value||'').match(/[0-9a-f]{32}/);
      if(!m){toast('招待リンクが読み取れません');return}
      closeAll();askJoin(m[0]);
    }else if(a==='copylink'){
      copy(inviteUrl()).then(()=>toast('招待リンクをコピーしました'));
    }else if(a==='invite'){
      const url=inviteUrl();
      if(navigator.share){try{await navigator.share({title:'買い物リストに参加',text:'買い物リストを一緒に使おう。このリンクを開くと同期されます。',url})}catch{}}
      else copy(url).then(()=>toast('招待リンクをコピーしました'));
    }else if(a==='leave'){
      closeAll();
      confirmSheet({title:'同期をやめますか？',msg:'この端末のリストはそのまま残ります。他の端末とは同期されなくなります。',label:'やめる',onOk:()=>{syncStop();toast('同期をやめました')}});
    }
  };
  open('#ovShare');
}
function askJoin(code){
  if(SY.room===code){toast('すでにこのリストと同期中です');return}
  if(!window.crypto?.subtle){toast('https のページで開いてください');return}
  confirmSheet({title:'共有リストに参加しますか？',
    msg:(SY.room?'今の同期先から、この招待先に切り替わります。':'')+'参加すると、この端末のリストも相手と共有され、以後は自動で同期されます。',
    label:'参加する',danger:false,onOk:async()=>{
      SY.room=code;saveSY();seen={};
      S.items.forEach(i=>dirty.add(i.id));
      await syncStart();toast('参加しました');
    }});
}
function checkIncoming(){
  const m=location.hash.match(/^#r=([0-9a-f]{32})$/); if(!m) return;
  history.replaceState(null,'',location.pathname+location.search);
  askJoin(m[1]);
}

/* ===== 買い物中は画面を消さない（Screen Wake Lock） ===== */
const AWAKE='kaimono2_awake';
let wl=null;
const awakeOn=()=>{try{return localStorage.getItem(AWAKE)==='1'}catch{return false}};
async function applyAwake(showErr){
  const b=$('#btnAwake'); if(!b) return;
  if(!('wakeLock' in navigator)){b.style.display='none';return}
  b.style.display='';b.classList.toggle('on',awakeOn());
  try{
    if(awakeOn()&&document.visibilityState==='visible'){
      if(!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}
    }else if(wl){await wl.release();wl=null}
  }catch{wl=null;if(showErr&&awakeOn())toast('端末の設定で画面の常時点灯が許可されていません')}
}
$('#btnAwake').addEventListener('click',()=>{
  const on=!awakeOn();
  try{localStorage.setItem(AWAKE,on?'1':'0')}catch{}
  haptic();applyAwake(true);
  toast(on?'☀️ 画面をつけたままにします':'画面は通常どおり消えます');
});
document.addEventListener('visibilitychange',()=>applyAwake(false));

/* ===== オフライン対応（Service Worker） ===== */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* ===== 旧版（JSONBin版）からの引き継ぎ =====
   同じURLで動いていた旧版が端末に残したデータ（と、あれば JSONBin の最新データ）を取り込む。
   id は 'o_'+旧id で固定なので、何度実行しても重複しない。 */
const MK='kaimono2_migrated';
const OLD_WHO={takuro:'たくろう',yuka:'ゆか'};
const OLD_SHOP={super:'スーパー',amazon:'Amazon',other:'その他'};
function importOld(items,templates){
  let n=0;const now=Date.now();
  const arr=a=>Array.isArray(a)?a:[];
  for(const o of arr(items)){
    if(!o||typeof o!=='object'||o.deleted) continue;
    const name=norm(String(o.name||'')).slice(0,60); if(!name) continue;
    const oid=String(o.id||'').replace(/[^A-Za-z0-9]/g,''); if(!oid) continue;
    const id='o_'+oid.slice(-20);
    if(S.items.some(i=>i.id===id)) continue;
    const unit=String(o.unit||''),q=Math.round(+o.qty||1);
    const plain=!unit||unit==='個';
    const memo=[OLD_WHO[o.person]||'',plain?'':(q>0?q+unit:''),String(o.note||'')].filter(Boolean).join(' ・ ').slice(0,100);
    const cat=OLD_SHOP[o.shop]||'スーパー';
    S.items.push(touch({id,name,cat,qty:plain?Math.min(99,Math.max(1,q)):1,
      memo,done:!!o.done,del:false,t:0}));
    if(!S.hist.some(h=>h.name===name)) S.hist.push({id:uid(),name,cat,n:1,pin:false});
    n++;
  }
  for(const o of arr(templates)){
    if(!o||typeof o!=='object'||o.deleted) continue;
    const name=norm(String(o.name||'')).slice(0,60); if(!name) continue;
    const h=S.hist.find(x=>x.name===name);
    if(h) h.pin=true; else S.hist.push({id:uid(),name,cat:OLD_SHOP[o.shop]||'スーパー',n:1,pin:true});
  }
  return n;
}
async function migrateOld(force){
  let total=0,found=false;
  try{
    if(!force&&localStorage.getItem(MK)) return;
    const d=JSON.parse(localStorage.getItem('shoplist-v6-data')||'null');
    if(d){found=true;total+=importOld(d.items,d.templates)}
    const room=JSON.parse(localStorage.getItem('shoplist-v6-room')||'null');
    if(room&&room.binId&&room.apiKey){
      found=true;
      try{
        const ac=new AbortController();const to=setTimeout(()=>ac.abort(),8000);
        const r=await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(room.binId)}/latest`,{headers:{'X-Access-Key':room.apiKey},signal:ac.signal});
        clearTimeout(to);
        if(r.ok){const j=await r.json();const rec=j.record||j;total+=importOld(rec.items,rec.templates)}
      }catch{}
    }
  }catch{}
  try{localStorage.setItem(MK,'1')}catch{}
  save();render();
  if(total) toast(`旧版から ${total} 件を引き継ぎました`);
  else if(force) toast(found?'新しく取り込む商品はありませんでした':'この端末に旧版のデータが見つかりません');
}

render();
applyAwake(false);
syncStart();
migrateOld();
checkIncoming();
</script>
